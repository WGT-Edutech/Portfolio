<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>William Thomason — EdTech Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;700&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
<style>
:root{--bg-ink:#03030a;--bg-deep:#0a0a12;--purple:#8b5cf6;--accent-indigo:#5b4dff;--text-cream:#f4f1ea;--text-dim:rgba(244,241,234,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:#000;color:var(--text-cream);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:3450vh}

#scene{position:fixed;inset:0;z-index:2;pointer-events:none}
.room{position:relative}
.sticky{position:sticky;top:0;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:10;will-change:transform}

.name-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6}
.name-text{font-family:'Roboto Flex',sans-serif;font-size:clamp(3.5rem,10vw,9rem);font-weight:700;color:var(--text-cream);text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 60px rgba(139,92,246,.4)}
.name-char{display:inline-block;opacity:0;transform:translateY(20px)}
.vp-char{display:inline-block;will-change:font-variation-settings}

.title-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:6}
.title-role{font-family:'Roboto Flex',sans-serif;font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:600;color:var(--purple);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 30px rgba(139,92,246,.5)}
.title-slogan{font-family:'Roboto Flex',sans-serif;font-size:clamp(1.2rem,2.8vw,2rem);color:var(--text-cream);letter-spacing:.04em;text-align:center}

#galleryRoom{position:absolute;inset:0;z-index:30;perspective:1200px;display:flex;align-items:center;justify-content:center}
.card-ring{position:relative;width:100%;height:100%;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.ring-card{position:absolute;left:50%;top:50%;width:420px;height:280px;margin-left:-210px;margin-top:-140px;transform-style:preserve-3d;cursor:pointer}
.ring-card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;backface-visibility:hidden;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(15,15,30,.85);box-shadow:0 10px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.ring-card-front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2rem}
.ring-card-title{font-family:'Oswald',sans-serif;font-size:1.5rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-cream);text-align:center;line-height:1.2}

#cardInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,170px);z-index:45;text-align:center;pointer-events:none;transition:opacity .4s ease}
.card-name{font-family:'Oswald',sans-serif;font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 15px rgba(91,77,255,.8),0 0 40px rgba(139,92,246,.5),0 0 80px rgba(91,77,255,.3);background:rgba(3,3,10,.7);padding:.4rem 1.5rem;border-radius:8px;border:1px solid rgba(139,92,246,.2)}

.ring-card .ring-card-inner{transition:box-shadow .4s ease,border-color .4s ease}
.ring-card:hover .ring-card-inner{border-color:rgba(139,92,246,.5);box-shadow:0 0 40px rgba(91,77,255,.3),0 20px 60px rgba(0,0,0,.6),0 0 100px rgba(139,92,246,.15)}

.phase-dots{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:.8rem}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(244,241,234,.2);border:1px solid rgba(244,241,234,.1);cursor:pointer;transition:all .3s;padding:0}
.dot.active{background:var(--purple);border-color:var(--purple);box-shadow:0 0 12px rgba(139,92,246,.5);transform:scale(1.3)}

.no-js .name-stage,.no-js .title-stage,.no-js #galleryRoom,.no-js .ring-card,.no-js .top-nav,.no-js .slogan-bar{opacity:1!important;visibility:visible!important}
.no-js .ring-card{position:relative;left:auto;top:auto;margin:8px;display:inline-block}

.top-nav{position:fixed;top:0;left:0;right:0;z-index:45;height:3.5rem;opacity:0;pointer-events:none;transition:opacity .5s;background:linear-gradient(to bottom,rgba(3,3,10,.95) 0%,rgba(3,3,10,.7) 70%,transparent 100%);display:flex;align-items:center;justify-content:flex-end;padding:0 2rem}
.top-nav.visible{opacity:1;pointer-events:auto}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;color:var(--text-dim);text-decoration:none;letter-spacing:.05em;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--purple)}
.donate-link{color:var(--purple)!important}

.section-buttons{position:fixed;bottom:calc((50vh - 140px) * 2 / 3);left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:1rem;opacity:0;pointer-events:none;transition:opacity .6s}
.section-buttons.visible{opacity:1;pointer-events:auto}
.sect-btn{display:inline-block;padding:.6em 1.8em;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;text-decoration:none;color:var(--text-cream);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:all .3s}
.sect-btn:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.4);transform:translateY(-2px)}
.donate-btn{background:var(--purple);border-color:var(--purple);box-shadow:0 0 20px rgba(139,92,246,.3)}
.donate-btn:hover{background:rgba(139,92,246,.8);box-shadow:0 0 30px rgba(139,92,246,.5)}

.slogan-bar{position:fixed;bottom:calc((50vh - 140px) / 3);left:0;right:0;z-index:50;text-align:center;padding:1.5rem 2rem;font-family:'Roboto Flex',sans-serif;font-size:clamp(1rem,2.5vw,1.6rem);color:var(--text-cream);letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .5s;text-shadow:0 0 30px rgba(139,92,246,.3)}
.slogan-bar.visible{opacity:1}

.gallery-floor{position:fixed;bottom:0;left:0;right:0;height:35vh;z-index:25;opacity:0;pointer-events:none;transition:opacity .8s;background:linear-gradient(to bottom,rgba(10,10,20,0) 0%,rgba(10,10,20,.5) 50%,rgba(3,3,10,.9) 100%)}
.gallery-floor.visible{opacity:1}
#galleryRoom{-webkit-box-reflect:below 0 linear-gradient(transparent 0%,transparent 55%,rgba(3,3,10,.85) 100%)}
@-moz-document url-prefix(){.gallery-floor{height:45vh}}

.r1h{height:1000vh}.r2h{height:3300vh}.r3h{height:1000vh}.r4h{height:500vh}.r5h{height:120vh}.r6h{height:2300vh}
@media(max-width:768px){.r1h{height:400vh}.r2h{height:2200vh}.r3h{height:667vh}.r4h{height:200vh}.r5h{height:80vh}.r6h{height:2300vh}}

.loading-screen{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.label-sm{font-family:'Inter',sans-serif;font-size:.9rem;color:#b794f4;letter-spacing:.12em;text-transform:uppercase;animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 8px rgba(139,92,246,.8),0 0 20px rgba(139,92,246,.5),0 0 40px rgba(91,77,255,.3)}50%{text-shadow:0 0 16px rgba(180,140,255,.95),0 0 40px rgba(139,92,246,.7),0 0 70px rgba(91,77,255,.5),0 0 100px rgba(139,92,246,.3)}}
.dna-helix{display:flex;align-items:center;justify-content:center;height:140px;position:relative;perspective:400px}
.dna-base{width:12px;height:110px;border-radius:4px;margin:0 14px;position:relative;transform-origin:center center;opacity:.2;filter:blur(2px);background-color:#2d1255;background-image:linear-gradient(to top,#22c55e 0%,#8b5cf6 40%,#4c1d95 100%);background-size:0% 100%;background-repeat:no-repeat;will-change:transform,opacity,filter,background-size,box-shadow}

@media(prefers-reduced-motion){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<section class="room r1h" id="r1">
  <div class="sticky">
    <div class="loading-screen" id="loader">
      <div class="label-sm">Scroll to energize</div>
      <div class="dna-helix" id="dnaHelix"></div>
    </div>
  </div>
</section>
<section class="room r2h" id="r2"><div class="sticky"></div></section>
<section class="room r3h" id="r3">
  <div class="sticky">
    <div class="name-stage" id="nameStage">
      <h1 class="name-text" id="nameText">William Thomason</h1>
    </div>
  </div>
</section>
<section class="room r4h" id="r4">
  <div class="sticky">
    <div class="title-stage" id="titleStage">
      <div class="title-role" id="roleText">EdTech Designer</div>
      <div class="title-slogan" id="sloganText">Building the Future of Learning.</div>
    </div>
  </div>
</section>
<section class="room r5h" id="r5"><div class="sticky"></div></section>
<section class="room r6h" id="r6">
  <div class="sticky">
    <section id="galleryRoom"><div class="card-ring" id="cardRing"></div></section>
    <div id="cardInfo"><div class="card-name" id="cardName"></div></div>
  </div>
</section>

<nav class="top-nav" id="topNav">
  <span class="nav-links">
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <a href="https://paypal.me/williamgraythomason" target="_blank" class="donate-link">Donate</a>
  </span>
</nav>
<div class="slogan-bar" id="sloganBar">Building the Future of Learning.</div>
<div class="gallery-floor" id="galleryFloor"></div>
<div class="section-buttons" id="sectionButtons">
  <a href="#about" class="sect-btn">About</a>
  <a href="#contact" class="sect-btn">Contact</a>
  <a href="https://paypal.me/williamgraythomason" target="_blank" class="sect-btn donate-btn">Donate</a>
</div>

<nav class="phase-dots" id="phaseDots" aria-label="Phase navigation">
  <button class="dot active" data-room="r1" aria-label="Dot background"></button>
  <button class="dot" data-room="r2" aria-label="Particle ring"></button>
  <button class="dot" data-room="r3" aria-label="Name reveal"></button>
  <button class="dot" data-room="r4" aria-label="Title and slogan"></button>
  <button class="dot" data-room="r5" aria-label="Cursor effects"></button>
  <button class="dot" data-room="r6" aria-label="Gallery"></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
document.documentElement.classList.remove('no-js');

var clamp01=function(v){return Math.max(0,Math.min(1,v));};
var lerp=function(a,b,t){return a+(b-a)*clamp01(t);};
var smoothstep=function(t){t=clamp01(t);return t*t*(3-2*t);};
var DPR=Math.min(window.devicePixelRatio||1,2);

// ── SCROLL STATE ──
var viewW=window.innerWidth,viewH=window.innerHeight;
var rooms=['r1','r2','r3','r4','r5','r6'].map(function(id){return document.getElementById(id);});
var roomData=rooms.map(function(el){return{el:el,progress:0,top:0,height:0};});

function cacheRooms(){
  roomData.forEach(function(r){
    var rect=r.el.getBoundingClientRect();
    r.top=rect.top+window.scrollY;
    r.height=rect.height;
  });
}
cacheRooms();
window.addEventListener('resize',function(){viewW=window.innerWidth;viewH=window.innerHeight;cacheRooms();});

// ── THREE.JS PARTICLES ──
var renderer,scene3,cam,pts,pGeo,pMat,bgPts,bgGeo,bgMat;
var P_COUNT=200,B_COUNT=250,pTgt,pPhase,bgTgt,bgPhase;
var mx3=0,my3=0,mtx3=0,mty3=0;
try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true,alpha:true});
  renderer.setPixelRatio(DPR);
  renderer.setSize(viewW,viewH);
  scene3=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(48,viewW/viewH,.1,1000);
  cam.position.set(0,.8,7);cam.lookAt(0,0,0);

  var P_RING=7;
  pGeo=new THREE.BufferGeometry();var pPos=new Float32Array(P_COUNT*3);pTgt=new Float32Array(P_COUNT*3);pPhase=new Float32Array(P_COUNT);
  for(var i=0;i<P_COUNT;i++){var a=(i/P_COUNT)*Math.PI*2;
    pTgt[i*3]=Math.cos(a)*P_RING;pTgt[i*3+1]=Math.sin(a)*.5;pTgt[i*3+2]=Math.sin(a)*P_RING;
    pPos[i*3]=(Math.random()-.5)*20;pPos[i*3+1]=(Math.random()-.5)*20;pPos[i*3+2]=(Math.random()-.5)*20;pPhase[i]=Math.random()*Math.PI*2;}
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  var pc=document.createElement('canvas');pc.width=32;pc.height=32;var pctx=pc.getContext('2d');
  var pg=pctx.createRadialGradient(16,16,1,16,16,16);
  pg.addColorStop(0,'rgba(220,200,255,1)');pg.addColorStop(0.15,'rgba(180,160,255,0.9)');pg.addColorStop(0.4,'rgba(140,120,240,0.4)');pg.addColorStop(0.7,'rgba(100,80,220,0.05)');pg.addColorStop(1,'rgba(0,0,0,0)');
  pctx.fillStyle=pg;pctx.fillRect(0,0,32,32);
  pMat=new THREE.PointsMaterial({size:.65,map:new THREE.CanvasTexture(pc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,color:0xb49cff});
  pts=new THREE.Points(pGeo,pMat);pts.scale.set(.01,.01,.01);scene3.add(pts);

  var B_RING=10;
  bgGeo=new THREE.BufferGeometry();var bgPos=new Float32Array(B_COUNT*3);bgTgt=new Float32Array(B_COUNT*3);bgPhase=new Float32Array(B_COUNT);
  for(var i=0;i<B_COUNT;i++){var a=(i/B_COUNT)*Math.PI*2;
    bgTgt[i*3]=Math.cos(a)*B_RING;bgTgt[i*3+1]=Math.sin(a)*.5;bgTgt[i*3+2]=Math.sin(a)*B_RING;
    bgPos[i*3]=(Math.random()-.5)*24;bgPos[i*3+1]=(Math.random()-.5)*24;bgPos[i*3+2]=(Math.random()-.5)*24;bgPhase[i]=Math.random()*Math.PI*2;}
  bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3));
  var bpc=document.createElement('canvas');bpc.width=32;bpc.height=32;var bctx=bpc.getContext('2d');
  var bgg=bctx.createRadialGradient(16,16,1,16,16,16);
  bgg.addColorStop(0,'rgba(255,200,255,1)');bgg.addColorStop(0.15,'rgba(255,159,252,0.9)');bgg.addColorStop(0.4,'rgba(255,140,245,0.4)');bgg.addColorStop(0.7,'rgba(200,80,220,0.05)');bgg.addColorStop(1,'rgba(0,0,0,0)');
  bctx.fillStyle=bgg;bctx.fillRect(0,0,32,32);
  bgMat=new THREE.PointsMaterial({size:.7,map:new THREE.CanvasTexture(bpc),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0,color:0xffb0ff});
  bgPts=new THREE.Points(bgGeo,bgMat);bgPts.position.z=-2;bgPts.scale.set(.01,.01,.01);scene3.add(bgPts);

  window.addEventListener('mousemove',function(e){mtx3=(e.clientX/viewW)*2-1;mty3=-(e.clientY/viewH)*2+1;},{passive:true});
}catch(e){console.error('Three.js:',e);}

function updateParticles(time){
  if(!pts)return;
  mx3+=(mtx3-mx3)*.35;my3+=(mty3-my3)*.35;
  var mag3D=new THREE.Vector3(mx3*28,my3*16,2);
  // Orbit: 1/8 orbit per scroll (room2 scrollable = height - viewport, 1 scroll ≈ viewport)
  var orbitRot=roomData[1].progress*Math.PI/4*Math.max(1,(roomData[1].height-viewH)/viewH)+time*.001*.5;
  // Illumination: visible from the very start of Room 2 (progress>0), ramps fast,
  // full pulse by ~1/3 of the zoom and stays lit. Invisible in Room 1 (progress=0).
  var illum=smoothstep(clamp01(roomData[1].progress*3));
  var posArr=pGeo.attributes.position.array;
  for(var i=0;i<P_COUNT;i++){var idx=i*3,a=(i/P_COUNT)*Math.PI*2,w=Math.sin(time*.001*.4+pPhase[i])*1,r=7+w*.8;
    pTgt[idx]=Math.cos(a+orbitRot)*r;pTgt[idx+1]=Math.sin(a*2+orbitRot*0.3)*1.5+w;pTgt[idx+2]=Math.sin(a+orbitRot)*r;
    var dx=posArr[idx]-mag3D.x,dy=posArr[idx+1]-mag3D.y,dz=posArr[idx+2]-mag3D.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,force=Math.min(12/dist,20);
    posArr[idx]+=(pTgt[idx]+(dx/dist)*force*.9-posArr[idx])*.12;
    posArr[idx+1]+=(pTgt[idx+1]+(dy/dist)*force*.9-posArr[idx+1])*.12;
    posArr[idx+2]+=(pTgt[idx+2]+(dz/dist)*force*.9-posArr[idx+2])*.12;
  }
  pGeo.attributes.position.needsUpdate=true;
  pMat.size=(.25+Math.abs(Math.sin(time*.001*.8))*.5)*(0.25+0.75*illum);
  pMat.opacity=illum*(.3+Math.abs(Math.sin(time*.001*.8))*.4);
  var bgPosArr=bgGeo.attributes.position.array;
  for(var i=0;i<B_COUNT;i++){var idx=i*3,a=(i/B_COUNT)*Math.PI*2,w=Math.sin(time*.001*.4+bgPhase[i])*1,r=10+w*.8;
    bgTgt[idx]=Math.cos(a+orbitRot)*r;bgTgt[idx+1]=Math.sin(a*2+orbitRot*0.3)*1.5+w;bgTgt[idx+2]=Math.sin(a+orbitRot)*r;
    var dx=bgPosArr[idx]-mag3D.x,dy=bgPosArr[idx+1]-mag3D.y,dz=bgPosArr[idx+2]-mag3D.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,force=Math.min(14/dist,18);
    bgPosArr[idx]+=(bgTgt[idx]+(dx/dist)*force*.9-bgPosArr[idx])*.14;
    bgPosArr[idx+1]+=(bgTgt[idx+1]+(dy/dist)*force*.9-bgPosArr[idx+1])*.14;
    bgPosArr[idx+2]+=(bgTgt[idx+2]+(dz/dist)*force*.9-bgPosArr[idx+2])*.14;
  }
  bgGeo.attributes.position.needsUpdate=true;
  bgMat.size=(.3+Math.abs(Math.sin(time*.001*.7+1.5))*.5)*(0.25+0.75*illum);
  bgMat.opacity=illum*(.25+Math.abs(Math.sin(time*.001*.7+1.5))*.35);
}

// ── TEXT EFFECTS ──
var nameText=document.getElementById('nameText'),nameStage=document.getElementById('nameStage');
var roleText=document.getElementById('roleText'),sloganText=document.getElementById('sloganText'),titleStage=document.getElementById('titleStage');

function splitToChars(el,cls){
  var text=el.textContent;el.textContent='';
  var chars=[];
  text.split('').forEach(function(ch){
    var s=document.createElement('span');s.className=cls;
    s.textContent=ch===' '?'\u00a0':ch;
    el.appendChild(s);chars.push(s);
  });
  return chars;
}
var nameVPChars=splitToChars(nameText,'name-char');
var roleVPChars=splitToChars(roleText,'vp-char');
var sloganVPChars=splitToChars(sloganText,'vp-char');
var allVPChars=[].concat(nameVPChars,roleVPChars,sloganVPChars);
var nameRevealCount=0;

function revealNameChars(count){
  nameVPChars.forEach(function(c,i){
    c.style.opacity=i<count?'1':'0';
    c.style.transform=i<count?'translateY(0)':'translateY(20px)';
  });
}
var curMX=0,curMY=0;
window.addEventListener('mousemove',function(e){curMX=e.clientX;curMY=e.clientY;},{passive:true});

function updateAllVP(){
  allVPChars.forEach(function(c){
    var rect=c.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    var dist=Math.hypot(curMX-cx,curMY-cy),radius=150;
    if(dist<radius){var t=1-dist/radius,wght=400+600*t,opsz=9+31*t;c.style.fontVariationSettings="'wght' "+Math.round(wght)+", 'opsz' "+Math.round(opsz);}
    else c.style.fontVariationSettings="'wght' 400, 'opsz' 9";
  });
}

// ── GALLERY CARDS ──
var cardData=[
  {name:'Language Tool',img:'images/language-tool.png'},
  {name:'Lingui Translator',img:'images/lingui-logo.svg'},
  {name:'IELTS Slide Decks',img:'images/ielts-speaking.png'},
  {name:'IELTS Speaking Portal',img:'images/ielts-speaking-portal.jpg',url:'https://wgt-edutech.github.io/IELTS-Speaking-Practice/'},
  {name:'Online Whiteboard',img:'images/whiteboard-screenshot.png'},
  {name:'Nebula Notepad',img:'images/nebula-notepad.png'},
  {name:'Alien Fret',img:'images/oobzoo-daw.png'},
  {name:'Alien Metronome',img:'images/alien-metronome.png'},
  {name:'Alien Tuner'},
  {name:'Alien Recorder',img:'images/alien-recorder.png'},
  {name:'Night Owl Manager',img:'images/night-owl.png'},
  {name:'Server Manager'},
  {name:'Booking Manager'},
  {name:'Grammar Slide Decks',img:'images/linking-words.png'},
  {name:'Video-Call App',img:'images/video-call.png'},
  {name:'Video Lesson Maker',img:'images/video-lesson-maker.png'},
  {name:'VBook Maker/Reader',img:'images/vbook.png'},
  {name:'Web Dev',url:'https://wgt-edutech.github.io/Portfolio/'},
  {name:'Articulate English Site',img:'images/wte.png'},
  {name:'VocabForge',img:'images/vocab-forge.png'},
  {name:'Sliding In',img:'images/sliding-in.png'},
  {name:'Hermes Dashboard',img:'images/hermes-dashboard.png'},
  {name:'Scalien',img:'images/scalien.png'},
  {name:'Qigong Morning Flow',img:'images/qigong-morning-flow.png'}
];
var $cardRing=document.getElementById('cardRing'),$cardName=document.getElementById('cardName'),$cardInfo=document.getElementById('cardInfo');
cardData.forEach(function(card){
  var el=document.createElement('div');el.className='ring-card';
  var inner=card.img
    ?'<div class="ring-card-inner"><div class="ring-card-front"><img src="'+card.img+'" alt="'+card.name+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px"></div></div>'
    :'<div class="ring-card-inner"><div class="ring-card-front"><span class="ring-card-title">'+card.name+'</span></div></div>';
  el.innerHTML=inner;
  el.addEventListener('mouseenter',function(){$cardName.textContent=card.name;$cardInfo.style.opacity='1';});
  el.addEventListener('mouseleave',function(){$cardInfo.style.opacity='0';});
  if(card.url)el.addEventListener('click',function(e){e.stopPropagation();window.open(card.url,'_blank');});
  el._spring={tx:0,tz:-400,ry:0,sc:.5,op:0,vtx:0,vtz:0,vry:0,vsc:0,vop:0};
  $cardRing.appendChild(el);
});

// ── PHASE DOTS ──
var dots=document.querySelectorAll('.phase-dots .dot');
dots.forEach(function(dot){
  dot.addEventListener('click',function(){
    document.getElementById(this.getAttribute('data-room')).scrollIntoView({behavior:'smooth'});
  });
});

// ── DNA LOADER ──
var BASE_COUNT=13;
var dnaHelix=document.getElementById('dnaHelix');
var dnaBases=[];
var dnaSmooth=null;
for(var i=0;i<BASE_COUNT;i++){
  var base=document.createElement('div');base.className='dna-base';
  dnaHelix.appendChild(base);dnaBases.push(base);
}

// ── TICK ──
var prevTime=0,lastFrame=0,MIN_MS=1000/30;

function tick(now){
  requestAnimationFrame(tick);
  if(now-lastFrame<MIN_MS)return;
  lastFrame=now;
  var dt=Math.min((now-prevTime)/1000,.1);prevTime=now;if(dt<=0)return;

  // Per-room progress from cache
  roomData.forEach(function(r){
    var total=r.height-viewH;
    r.progress=total<=0?(r.top<=window.scrollY?1:0):clamp01((window.scrollY-r.top)/total);
  });
  var rp=roomData.map(function(r){return r.progress;});

  // Active room for dots
  var best=-1,bestV=0;
  roomData.forEach(function(r,i){if(r.progress>0&&r.progress<1||i===0&&r.progress===0){var v=r.progress<.5?r.progress:1-r.progress;if(v<.15&&(best===-1||i>best))best=i;}});
  if(best===-1)for(var i=0;i<roomData.length;i++)if(roomData[i].progress>=1){best=i;}
  dots.forEach(function(d,i){d.classList.toggle('active',i===best);});

  // Room 1: DNA loader — fill (0-40%), hold fully lit centered, still spinning (40-70%), fade in place (70-100%)
  var helixP=rp[0],loader=document.getElementById('loader');
  var strandSpan=1/BASE_COUNT,LERP_SPEED=.08;
  var FILL_END=.4,HOLD_END=.7;
  var fillP=clamp01(helixP/FILL_END);                      // 0→1 over first ~4 scrolls
  var fadeP=clamp01((helixP-HOLD_END)/(1-HOLD_END));       // 0→1 over last ~3 scrolls
  if(!dnaSmooth){dnaSmooth=new Float32Array(BASE_COUNT);for(var i=0;i<BASE_COUNT;i++)dnaSmooth[i]=0;}
  dnaBases.forEach(function(base,i){
    var targetP=clamp01((fillP-i*strandSpan)/strandSpan);
    dnaSmooth[i]+=(targetP-dnaSmooth[i])*LERP_SPEED;
    var sp=dnaSmooth[i];
    var rotY=helixP*Math.PI*12+(i/BASE_COUNT)*Math.PI*2;   // motion continues the whole room, never freezes
    base.style.transform='rotateY('+(rotY*180/Math.PI)+'deg) rotateX(25deg)';
    base.style.backgroundSize=(smoothstep(sp)*100)+'% 100%';
    base.style.opacity=(.25+smoothstep(sp)*.75).toFixed(3);
    base.style.filter='blur('+((2-smoothstep(sp)*2).toFixed(2))+'px)';
    if(sp>0){
      var glowP=smoothstep(sp),gt=clamp01((sp-.4)/.6);
      var gr=Math.round(34+(139-34)*(1-gt)),gg=Math.round(92+(197-92)*gt),gb=Math.round(246+(94-246)*gt);
      base.style.boxShadow='0 0 '+(glowP*25).toFixed(1)+'px rgba('+gr+','+gg+','+gb+','+(glowP*.7).toFixed(2)+'), 0 0 '+(glowP*55).toFixed(1)+'px rgba(139,92,246,'+(glowP*.5).toFixed(2)+')';
    }else base.style.boxShadow='none';
  });
  loader.style.opacity=(1-smoothstep(fadeP)).toFixed(3);

  // Room 2: Particles zoom (illumination is driven inside updateParticles by room progress)
  if(pts){var ps=lerp(.01,1,smoothstep(rp[1]));pts.scale.set(ps,ps,ps);bgPts.scale.set(ps,ps,ps);}

  // Room 3: Name reveal — typewriter 3 scrolls (0-33%), hold 3 scrolls (33-66%), fade out in place 3 scrolls (66-100%)
  if(rp[2]>.01){var tComp=1/3,tP=Math.min(1,rp[2]/tComp),target=Math.floor(tP*nameVPChars.length);if(target!==nameRevealCount){revealNameChars(target);nameRevealCount=target;}
    var nFade=clamp01((rp[2]-2/3)/(1/3));
    nameStage.style.opacity=(1-smoothstep(nFade)).toFixed(3);
    updateAllVP();}
  else{nameStage.style.opacity='0';nameRevealCount=0;}

  // Room 4: Title + Slogan
  if(rp[3]>.02){titleStage.style.opacity='1';var tp=Math.min(1,rp[3]/.35);roleText.style.opacity=tp;sloganText.style.opacity=Math.max(0,Math.min(1,(rp[3]-.2)/.3));updateAllVP();}
  else titleStage.style.opacity='0';

  // Room 5: Shrink to nav
  var shrinkP=rp[4],heroEl=document.getElementById('nameStage'),titleEl=document.getElementById('titleStage'),navBar=document.getElementById('topNav'),sloganBar=document.getElementById('sloganBar');
  if(shrinkP>.01){
    var shrink=lerp(1,.15,smoothstep(shrinkP)),topY=lerp(50,.3,shrinkP),leftX=lerp(50,1.5,shrinkP);
    heroEl.style.position='fixed';heroEl.style.top=topY+'vh';heroEl.style.left=leftX+'vw';heroEl.style.transform='translate(0,0) scale('+shrink+')';heroEl.style.transformOrigin='top left';heroEl.style.zIndex='46';heroEl.style.opacity=Math.min(1,shrinkP*4).toFixed(3);
    titleEl.style.position='fixed';titleEl.style.top=(topY+2.5)+'vh';titleEl.style.left=leftX+'vw';titleEl.style.transform='translate(0,0) scale('+(shrink*.7)+')';titleEl.style.transformOrigin='top left';titleEl.style.zIndex='46';titleEl.style.opacity=shrinkP>.25?'1':'0';
    sloganBar.classList.toggle('visible',shrinkP>.35);
    navBar.classList.toggle('visible',shrinkP>.75);
  }else{
    heroEl.style.position='';heroEl.style.top='';heroEl.style.left='';heroEl.style.transform='';heroEl.style.transformOrigin='';heroEl.style.zIndex='';
    titleEl.style.position='';titleEl.style.top='';titleEl.style.left='';titleEl.style.transform='';titleEl.style.transformOrigin='';titleEl.style.zIndex='';
    navBar.classList.remove('visible');sloganBar.classList.remove('visible');
  }

  // Room 6: Gallery
  var galP=rp[5],gallery=document.getElementById('galleryRoom'),floor=document.getElementById('galleryFloor'),sectBtns=document.getElementById('sectionButtons');
  if(galP>0){gallery.style.opacity='1';gallery.style.visibility='visible';floor.classList.add('visible');sectBtns.classList.add('visible');
    var ringCards=document.querySelectorAll('.ring-card'),total=ringCards.length,sp=galP*(total-1),activeIdx=Math.max(0,Math.min(total-1,Math.round(sp)));
    var STIFF=.08,DAMP=.72;
    ringCards.forEach(function(card,i){var dist=i-activeIdx,s=card._spring,tx,tz,ry,sc,op;
      if(dist===0){tx=0;tz=120;ry=0;sc=1;op=1;}else if(dist===-1){tx=-370;tz=-130;ry=32;sc=1;op=1;}else if(dist===1){tx=370;tz=-130;ry=-32;sc=1;op=1;}else if(dist===-2){tx=-550;tz=-230;ry=42;sc=.9;op=.5;}else if(dist===2){tx=550;tz=-230;ry=-42;sc=.9;op=.5;}else{tx=0;tz=-400;ry=0;sc=.5;op=0;}
      s.vtx+=(tx-s.tx)*STIFF;s.vtx*=DAMP;s.tx+=s.vtx;s.vtz+=(tz-s.tz)*STIFF;s.vtz*=DAMP;s.tz+=s.vtz;s.vry+=(ry-s.ry)*STIFF;s.vry*=DAMP;s.ry+=s.vry;s.vsc+=(sc-s.sc)*STIFF;s.vsc*=DAMP;s.sc+=s.vsc;s.vop+=(op-s.op)*STIFF;s.vop*=DAMP;s.op+=s.vop;
      card.style.transform='translateX('+s.tx.toFixed(1)+'px) translateZ('+s.tz.toFixed(1)+'px) rotateY('+s.ry.toFixed(1)+'deg) scale('+s.sc.toFixed(2)+')';
      card.style.opacity=Math.max(0,Math.min(1,s.op)).toFixed(3);card.style.zIndex=dist===0?'100':Math.abs(dist)===1?'50':'30';card.style.pointerEvents=s.op>.3?'auto':'none';
    });
    navBar.classList.add('visible');sloganBar.classList.add('visible');
  }else{gallery.style.opacity='0';gallery.style.visibility='hidden';floor.classList.remove('visible');sectBtns.classList.remove('visible');}

  updateParticles(now);
  if(renderer){renderer.render(scene3,cam);if(viewW!==renderer.domElement.width||viewH!==renderer.domElement.height){renderer.setSize(viewW,viewH);cam.aspect=viewW/viewH;cam.updateProjectionMatrix();}}
}

prevTime=performance.now();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
