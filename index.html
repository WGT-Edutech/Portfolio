<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>William Thomason — EdTech Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;700&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
<style>
:root{--purple:#8b5cf6;--text-cream:#f4f1ea;--text-dim:rgba(244,241,234,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:#000;color:var(--text-cream);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}

#scene{position:fixed;inset:0;z-index:2;pointer-events:none}
.room{position:relative}
.sticky{position:sticky;top:0;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:10;will-change:transform}

.name-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:6;opacity:0}
.name-text{font-family:'Roboto Flex',sans-serif;font-size:clamp(3.5rem,10vw,7rem);font-weight:700;color:var(--text-cream);text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 2px hsl(260 90% 75% / .8),0 0 4px hsl(260 90% 65% / .4)}
.name-char{display:inline-block;opacity:0;transform:translateY(20px)}
.vp-char{display:inline-block;will-change:font-variation-settings}

.title-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:6;opacity:0;transform:translateY(150px)}
.title-role{font-family:'Roboto Flex',sans-serif;font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:600;color:var(--purple);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 2px hsl(260 90% 75% / .65)}
.title-slogan{font-family:'Roboto Flex',sans-serif;font-size:clamp(2.4rem,5.6vw,4rem);color:var(--text-cream);letter-spacing:.04em;text-align:center;text-shadow:0 0 2px hsl(260 90% 75% / .6)}

#galleryRoom{position:absolute;inset:0;z-index:30;perspective:1200px;display:flex;align-items:center;justify-content:center}
.card-ring{position:relative;width:100%;height:100%;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.ring-card{position:absolute;left:50%;top:50%;width:420px;height:280px;margin-left:-210px;margin-top:-140px;transform-style:preserve-3d;cursor:pointer}
.ring-card-inner{position:relative;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0a0a12;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.35),inset 1px 0 0 rgba(255,255,255,.04),inset -1px 0 0 rgba(0,0,0,.15),0 10px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:box-shadow .4s ease,border-color .4s ease}
.ring-card-reflect{position:absolute;top:100%;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;opacity:.55}
.ring-card-reflect img{width:100%;height:100%;object-fit:cover;transform:scaleY(-1);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%)}
.ring-card-front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;padding:2rem}
.ring-card-title{font-family:'Oswald',sans-serif;font-size:1.5rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-cream);text-align:center;line-height:1.2;text-shadow:0 0 1px hsl(260 90% 75% / .55)}

#cardInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,-185px);z-index:45;text-align:center;pointer-events:none;transition:opacity .4s ease}
.card-name{font-family:'Oswald',sans-serif;font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 0 2px rgba(160,130,255,.5);background:rgba(3,3,10,.7);padding:.4rem 1.5rem;border-radius:8px;border:1px solid rgba(139,92,246,.2)}

.ring-card:hover .ring-card-inner{border-color:rgba(139,92,246,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 0 rgba(0,0,0,.4),0 0 3px rgba(160,130,255,.3),0 20px 60px rgba(0,0,0,.6)}

.phase-dots{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:.8rem}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(244,241,234,.2);border:1px solid rgba(244,241,234,.1);cursor:pointer;transition:all .3s;padding:0}
.dot.active{background:radial-gradient(circle,rgba(200,170,255,.9) 20%,var(--purple) 55%,rgba(139,92,246,.3) 100%);border-color:var(--purple);box-shadow:none;transform:scale(1.3)}

.no-js .name-stage,.no-js .title-stage,.no-js #galleryRoom,.no-js .ring-card,.no-js .top-nav,.no-js .slogan-bar{opacity:1!important;visibility:visible!important}
.no-js .ring-card{position:relative;left:auto;top:auto;margin:8px;display:inline-block}

.top-nav{position:fixed;top:0;left:0;right:0;z-index:45;height:3.5rem;opacity:0;pointer-events:none;transition:opacity .5s;background:rgba(0,0,0,.85);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:flex-end;padding:0 2rem}
.top-nav.visible{opacity:1;pointer-events:auto}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;color:var(--text-dim);text-decoration:none;letter-spacing:.05em;text-transform:uppercase;transition:color .3s}
.nav-links a:hover{color:var(--purple)}
.donate-link{color:var(--purple)!important}

.section-buttons{position:fixed;bottom:calc((50vh - 140px) * 2 / 3);left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:1rem;opacity:0;pointer-events:none;transition:opacity .6s}
.section-buttons.visible{opacity:1;pointer-events:auto}
.sect-btn{display:inline-block;padding:.6em 1.8em;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;text-decoration:none;color:var(--text-cream);text-shadow:0 0 1px hsl(260 90% 75% / .45);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:all .3s}
.sect-btn:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.4);transform:translateY(-2px)}
.donate-btn{background:var(--purple);border-color:var(--purple);box-shadow:0 0 4px rgba(180,140,255,.35)}
.donate-btn:hover{background:rgba(139,92,246,.8);box-shadow:0 0 4px rgba(180,140,255,.5)}
/* Base state: arrows are a portrait-only affordance, hidden everywhere else.
   Must precede the media queries below or it would override them. */
.gal-arrow{display:none}

.slogan-bar{position:fixed;bottom:calc((50vh - 140px) / 3 - 150px);left:0;right:0;z-index:50;text-align:center;padding:1.5rem 2rem;font-family:'Roboto Flex',sans-serif;font-size:clamp(2rem,5vw,3.2rem);color:var(--text-cream);letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .6s;text-shadow:0 0 2px hsl(260 90% 75% / .5)}
.slogan-bar.visible{opacity:1;transition:opacity 7s}

.gallery-floor{position:fixed;bottom:0;left:0;right:0;height:38vh;z-index:25;opacity:0;pointer-events:none;transition:opacity .8s;background:radial-gradient(ellipse 80% 100% at 50% 100%,rgba(0,0,0,.3) 0%,rgba(0,0,0,.85) 100%)}
.gallery-floor.visible{opacity:1}
#varprox{position:fixed;top:0;left:0;right:0;height:25vh;z-index:42;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 2.5s}
#varprox.visible{opacity:1}
#varprox .variable-proximity{font-family:'Roboto Flex',sans-serif;font-size:clamp(2rem,8vw,6rem);font-weight:400;letter-spacing:.04em;line-height:1.2;text-align:center;white-space:nowrap;color:rgba(91,77,255,.8);text-shadow:0 0 2px rgba(160,130,255,.4);user-select:none;-webkit-user-select:none}
@-moz-document url-prefix(){.gallery-floor{height:45vh}}

.r1h{height:1000vh}.r2h{height:1100vh}.r3h{height:1000vh}.r4h{height:500vh}.r5h{height:120vh}.r6h{height:2300vh}
@media(max-width:768px){.r1h{height:400vh}.r2h{height:1100vh}.r3h{height:667vh}.r4h{height:200vh}.r5h{height:80vh}}
/* Portrait pacing: r2 (the particle zoom) was 1100vh — ~27 phone screens of
   near-identical motion. Rebalanced so no room is a dead stretch. */
@media(max-width:768px) and (orientation:portrait){
  .r1h{height:340vh}.r2h{height:560vh}.r3h{height:420vh}.r4h{height:220vh}.r5h{height:70vh}
}

.nav-brand{display:none}
.menu-toggle{display:none}
@media(max-width:768px){
  .lbl-desk{display:none}.lbl-mob{display:inline}
  .top-nav{justify-content:space-between;padding:0 1rem}
  .nav-brand{display:block;font-family:'Oswald',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:.18em;color:var(--text-cream);text-shadow:0 0 6px rgba(139,92,246,.3)}
  .nav-links{display:none}
  .menu-toggle{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;padding:0;background:none;border:0;cursor:pointer;-webkit-appearance:none}
  .menu-toggle span{display:block;width:22px;height:2px;background:var(--text-cream);border-radius:2px;transition:transform .3s ease,opacity .3s ease}
  .menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .menu-toggle.open span:nth-child(2){opacity:0}
  .menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  #cardInfo{display:none}
}
@media(orientation:portrait){
  .name-text{line-height:1.12;text-align:center}
  /* The single space between WILLIAM and THOMASON becomes a designed hairline
     rule instead of an empty inline-block box (that box was the phantom line
     that made the lockup 183px tall for two 61px lines). */
  .name-text .name-space{display:block;width:min(46vw,230px);height:1px;margin:0 auto;
    background:linear-gradient(to right,transparent,rgba(160,130,255,.7),transparent);
    opacity:.85;transform:none!important}
  .title-slogan{line-height:1.25;font-size:clamp(1.4rem,4.2vw,4rem)}
  /* Explicit, controlled break point — never a phantom empty line. */
  .title-slogan .name-space{display:block;width:100%;height:0}
}
@media(max-width:768px) and (orientation:portrait){
  /* Dot rail becomes a horizontal pill at the bottom, clear of the name lockup,
     with 44px hit targets (the visual dot stays small; ::after grows the box). */
  .phase-dots{right:auto;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);
    transform:translateX(-50%);flex-direction:row;gap:.9rem;padding:.7rem .9rem;
    border-radius:999px;background:rgba(3,3,10,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.06)}
  .dot{width:12px;height:12px;position:relative}
  .dot::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%)}
  .r6h{height:280vh}
  #galleryRoom{perspective:none;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
  #galleryRoom::-webkit-scrollbar{display:none}
  .card-ring{width:max-content;min-width:100%;flex-direction:row;align-items:center;gap:18px;transform-style:flat;padding:0 10vw}
  .ring-card{position:relative;left:auto;top:auto;width:80vw;height:53vw;max-width:400px;max-height:270px;margin:0;flex:0 0 auto;scroll-snap-align:center;scroll-snap-stop:always;transform:none!important;opacity:1!important;pointer-events:auto!important;z-index:auto!important}
  .ring-card-inner{-webkit-box-reflect:none}
  .ring-card-reflect{display:none}
  /* Caption: touch has no hover, so the project name must always be visible.
     Replaces the desktop #cardInfo{display:none} with a persistent caption. */
  #cardInfo{display:block;position:fixed;left:50%;right:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 4.6rem);
    transform:translateX(-50%);width:min(86vw,420px);z-index:60;opacity:1!important;pointer-events:none;transition:none}
  .card-name{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:.06em;padding:.35rem 1.1rem}
  /* Prev/next affordance — swipe still works, but arrows make it discoverable. */
  .gal-arrow{display:flex;align-items:center;justify-content:center;position:fixed;top:50%;z-index:60;
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
    background:rgba(3,3,10,.6);backdrop-filter:blur(6px);color:var(--text-cream);
    font-size:1.5rem;line-height:1;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;
    -webkit-appearance:none;appearance:none;padding:0}
  .gal-arrow.visible{opacity:1;pointer-events:auto}
  .gal-prev{left:.6rem;transform:translateY(-50%)}
  .gal-next{right:.6rem;transform:translateY(-50%)}
  /* Notch / home-bar clearance for the fixed chrome. */
  .top-nav{padding-top:env(safe-area-inset-top,0px);height:calc(3.5rem + env(safe-area-inset-top,0px))}
  .section-buttons{bottom:calc(env(safe-area-inset-bottom,0px) + 4.2rem)}
  .slogan-bar{bottom:calc(env(safe-area-inset-bottom,0px) + 4.6rem)}
  .mobile-menu{top:calc(3.5rem + env(safe-area-inset-top,0px))}
  .menu-backdrop{top:calc(3.5rem + env(safe-area-inset-top,0px))}
}
.menu-backdrop{position:fixed;top:3.5rem;left:0;right:0;bottom:0;z-index:104;background:rgba(3,3,10,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.menu-backdrop.open{opacity:1;pointer-events:auto}
.mobile-menu{position:fixed;top:3.5rem;right:0;bottom:0;width:min(280px,80vw);z-index:110;display:flex;flex-direction:column;gap:1.1rem;padding:2.2rem 1.8rem;background:rgba(10,10,20,.94);backdrop-filter:blur(14px);border-left:1px solid rgba(139,92,246,.25);box-shadow:-10px 0 40px rgba(0,0,0,.5);transform:translateX(105%);visibility:hidden;pointer-events:none;transition:transform .35s ease,visibility 0s .35s}
.mobile-menu.open{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .35s ease,visibility 0s}
.mobile-menu a{font-family:'Inter',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:rgba(244,241,234,.9);padding:.6rem .4rem;border-bottom:1px solid rgba(255,255,255,.06);transition:color .3s,text-shadow .3s}
.mobile-menu a:hover{color:var(--purple);text-shadow:0 0 6px rgba(139,92,246,.4)}
.mobile-menu a.donate-link{color:var(--purple)}

.loading-screen{display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.label-sm{font-family:'Inter',sans-serif;font-size:.9rem;color:#b794f4;letter-spacing:.12em;text-transform:uppercase;animation:pulseGlow 1.8s ease-in-out infinite}
.lbl-mob{display:none}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 1px hsl(260 90% 75% / .75)}50%{text-shadow:0 0 2px hsl(260 95% 80% / .95)}}
.dna-helix{display:flex;align-items:center;justify-content:center;height:140px;position:relative;perspective:400px}
.dna-base{width:12px;height:110px;border-radius:4px;margin:0 14px;position:relative;transform-origin:center center;opacity:.2;background-color:#2d1255;background-image:linear-gradient(to top,#22c55e 0%,#8b5cf6 40%,#4c1d95 100%);background-size:0% 100%;background-repeat:no-repeat;will-change:transform,opacity,background-size,box-shadow}

@media(prefers-reduced-motion){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<section class="room r1h" id="r1">
  <div class="sticky">
    <div class="loading-screen" id="loader">
      <div class="label-sm"><span class="lbl-desk">keep scrolling down</span><span class="lbl-mob">keep swiping up</span></div>
      <div class="dna-helix" id="dnaHelix"></div>
    </div>
  </div>
</section>
<section class="room r2h" id="r2"><div class="sticky"></div></section>
<section class="room r3h" id="r3">
  <div class="sticky">
    <div class="name-stage" id="nameStage">
      <h1 class="name-text" id="nameText">William Thomason</h1>
    </div>
  </div>
</section>
<section class="room r4h" id="r4">
  <div class="sticky">
    <div class="title-stage" id="titleStage">
      <div class="title-role" id="roleText">EdTech Designer</div>
      <div class="title-slogan" id="sloganText">Building the Future of Learning.</div>
    </div>
  </div>
</section>
<section class="room r5h" id="r5"><div class="sticky"></div></section>
<section class="room r6h" id="r6">
  <div class="sticky">
    <section id="galleryRoom"><div class="card-ring" id="cardRing"></div></section>
    <div id="cardInfo"><div class="card-name" id="cardName"></div></div>
    <button class="gal-arrow gal-prev" id="galPrev" aria-label="Previous project">&#8249;</button>
    <button class="gal-arrow gal-next" id="galNext" aria-label="Next project">&#8250;</button>
  </div>
</section>

<nav class="top-nav" id="topNav">
  <span class="nav-brand">WT</span>
  <span class="nav-links">
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <a href="https://paypal.me/williamgraythomason" target="_blank" class="donate-link">Donate</a>
  </span>
  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu"><span></span><span></span><span></span></button>
</nav>
<div class="menu-backdrop" id="menuBackdrop"></div>
<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile menu">
  <a href="#about">About</a>
  <a href="#contact">Contact</a>
  <a href="https://paypal.me/williamgraythomason" target="_blank" class="donate-link">Donate</a>
</nav>
<div class="slogan-bar" id="sloganBar">Building the Future of Learning.</div>
<div class="gallery-floor" id="galleryFloor"></div>
<div id="varprox" aria-hidden="true"><span class="variable-proximity">Projects</span></div>
<div class="section-buttons" id="sectionButtons">
  <a href="#about" class="sect-btn">About</a>
  <a href="#contact" class="sect-btn">Contact</a>
  <a href="https://paypal.me/williamgraythomason" target="_blank" class="sect-btn donate-btn">Donate</a>
</div>

<nav class="phase-dots" id="phaseDots" aria-label="Phase navigation">
  <button class="dot active" data-room="r1" aria-label="Dot background"></button>
  <button class="dot" data-room="r2" aria-label="Particle ring"></button>
  <button class="dot" data-room="r3" aria-label="Name reveal"></button>
  <button class="dot" data-room="r4" aria-label="Title and slogan"></button>
  <button class="dot" data-room="r5" aria-label="Cursor effects"></button>
  <button class="dot" data-room="r6" aria-label="Gallery"></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
document.documentElement.classList.remove('no-js');

var clamp01=function(v){return Math.max(0,Math.min(1,v));};
var lerp=function(a,b,t){return a+(b-a)*clamp01(t);};
var smoothstep=function(t){t=clamp01(t);return t*t*(3-2*t);};
var DPR=Math.min(window.devicePixelRatio||1,2);

// ── SCROLL STATE ──
var viewW=window.innerWidth,viewH=window.innerHeight;
var mobilePortraitNow=false;
var rooms=['r1','r2','r3','r4','r5','r6'].map(function(id){return document.getElementById(id);});
var roomData=rooms.map(function(el){return{el:el,progress:0,top:0,height:0};});

function cacheRooms(){
  roomData.forEach(function(r){
    var rect=r.el.getBoundingClientRect();
    r.top=rect.top+window.scrollY;
    r.height=rect.height;
  });
}
cacheRooms();
window.addEventListener('resize',function(){viewW=window.innerWidth;viewH=window.innerHeight;cacheRooms();});

// ── THREE.JS PARTICLES ──
var renderer,scene3,cam,pts,pGeo,pMat,bgPts,bgGeo,bgMat;
var P_COUNT=200,B_COUNT=250,pTgt,pPhase,bgTgt,bgPhase,pSwellD,bgSwellD;
var mx3=0,my3=0,mtx3=0,mty3=0,projV3=null;
try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true,alpha:true});
  renderer.setPixelRatio(DPR);
  renderer.setSize(viewW,viewH);
  scene3=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(48,viewW/viewH,.1,1000);
  cam.position.set(0,.8,7);cam.lookAt(0,0,0);

  var P_RING=7;
  pGeo=new THREE.BufferGeometry();var pPos=new Float32Array(P_COUNT*3);pTgt=new Float32Array(P_COUNT*3);pPhase=new Float32Array(P_COUNT);
  for(var i=0;i<P_COUNT;i++){var a=(i/P_COUNT)*Math.PI*2;
    pTgt[i*3]=Math.cos(a)*P_RING;pTgt[i*3+1]=Math.sin(a)*.5;pTgt[i*3+2]=Math.sin(a)*P_RING;
    pPos[i*3]=(Math.random()-.5)*20;pPos[i*3+1]=(Math.random()-.5)*20;pPos[i*3+2]=(Math.random()-.5)*20;pPhase[i]=Math.random()*Math.PI*2;}
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  pSwellD=new Float32Array(P_COUNT);for(var i=0;i<P_COUNT;i++)pSwellD[i]=Math.random();

function updateParticles(time){
  if(!pts)return;
  var RING_Y=.55;
  mx3+=(mtx3-mx3)*.35;my3+=(mty3-my3)*.35;
  var mag3D=new THREE.Vector3(mx3*28,my3*16,2);
  // Orbit: 1/8 orbit per scroll (room2 scrollable = height - viewport, 1 scroll ≈ viewport)
  var orbitRot=roomData[1].progress*Math.PI/4*Math.max(1,(roomData[1].height-viewH)/viewH)+time*.001*.5;
  // Illumination model: "a lamp approaching" — the cloud is a faint glimmer in
  // the distance (opacity ∝ zoom scale ps, so additive overlap can't saturate),
  // grows steadily through the zoom, and is fully lit by ~2/3 of Room 2, holding
  // bright through the end. Exactly 0 in Room 1 (rp1=0).
  var rp1=clamp01(roomData[1].progress);
  var ps=lerp(.01,1,smoothstep(rp1));
  var psOp=lerp(.25,1,smoothstep(rp1));
  var illum=rp1>0 ? (.2+.8*clamp01(rp1*1.4)) : 0;
  var posArr=pGeo.attributes.position.array;
  for(var i=0;i<P_COUNT;i++){var idx=i*3,a=(i/P_COUNT)*Math.PI*2,w=Math.sin(time*.001*.4+pPhase[i])*1,r=7+w*.8;
    pTgt[idx]=Math.cos(a+orbitRot)*r;pTgt[idx+1]=Math.sin(a*2+orbitRot*0.3)*1.5+w+RING_Y;pTgt[idx+2]=Math.sin(a+orbitRot)*r;
    var dx=posArr[idx]-mag3D.x,dy=posArr[idx+1]-mag3D.y,dz=posArr[idx+2]-mag3D.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,force=Math.min(12/dist,20);
    posArr[idx]+=(pTgt[idx]+(dx/dist)*force*.9-posArr[idx])*.12;
    posArr[idx+1]+=(pTgt[idx+1]+(dy/dist)*force*.9-posArr[idx+1])*.12;
    posArr[idx+2]+=(pTgt[idx+2]+(dz/dist)*force*.9-posArr[idx+2])*.12;
  }
  pGeo.attributes.position.needsUpdate=true;
  // Cursor swell: project each particle to NDC, swell up to 3x within SWELL_R of cursor.
  // Staggered per-particle (pSwellD): the swell starts at a random fraction of the
  // approach, so particles ripple instead of popping in sync.
  if(!projV3)projV3=new THREE.Vector3();
  var SWELL_R=.22,aSz=pGeo.attributes.aSize.array;
  for(var i=0;i<P_COUNT;i++){var idx=i*3;
    projV3.set(posArr[idx],posArr[idx+1],posArr[idx+2]).project(cam);
    var sdx=projV3.x-mx3,sdy=projV3.y-my3,sd=Math.sqrt(sdx*sdx+sdy*sdy);
    var sw=clamp01(1-sd/SWELL_R),st=clamp01((sw-pSwellD[i]*.4)/.6);
    aSz[i]=1+2*smoothstep(st);   // 1 far → up to 3 at cursor, staggered
  }
  pGeo.attributes.aSize.needsUpdate=true;
  // REVIEW FIX (2026-08-08): size grows WITH illum so net light (op*size^2) is
  // monotonic and reaches 0.8 at end of room (illum=0.8, mid-pulse).
  pMat.size=(.3+Math.abs(Math.sin(time*.001*.8))*.5)*(.6+1.433*illum);
  pMat.opacity=illum*psOp*(.8+Math.abs(Math.sin(time*.001*.8))*.2);
  var bgPosArr=bgGeo.attributes.position.array;
  for(var i=0;i<B_COUNT;i++){var idx=i*3,a=(i/B_COUNT)*Math.PI*2,w=Math.sin(time*.001*.4+bgPhase[i])*1,r=10+w*.8;
    bgTgt[idx]=Math.cos(a+orbitRot)*r;bgTgt[idx+1]=Math.sin(a*2+orbitRot*0.3)*1.5+w+RING_Y;bgTgt[idx+2]=Math.sin(a+orbitRot)*r;
    var dx=bgPosArr[idx]-mag3D.x,dy=bgPosArr[idx+1]-mag3D.y,dz=bgPosArr[idx+2]-mag3D.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz)+.001,force=Math.min(14/dist,18);
    bgPosArr[idx]+=(bgTgt[idx]+(dx/dist)*force*.9-bgPosArr[idx])*.14;
    bgPosArr[idx+1]+=(bgTgt[idx+1]+(dy/dist)*force*.9-bgPosArr[idx+1])*.14;
    bgPosArr[idx+2]+=(bgTgt[idx+2]+(dz/dist)*force*.9-bgPosArr[idx+2])*.14;
  }
  bgGeo.attributes.position.needsUpdate=true;
  // Cursor swell for pink ring (staggered, up to 3x).
  var bSz=bgGeo.attributes.aSize.array;
  for(var i=0;i<B_COUNT;i++){var idx=i*3;
    projV3.set(bgPosArr[idx],bgPosArr[idx+1],bgPosArr[idx+2]).project(cam);
    var bdx=projV3.x-mx3,bdy=projV3.y-my3,bd=Math.sqrt(bdx*bdx+bdy*bdy);
    var bw=clamp01(1-bd/SWELL_R),bt=clamp01((bw-bgSwellD[i]*.4)/.6);
    bSz[i]=1+2*smoothstep(bt);
  }
  bgGeo.attributes.aSize.needsUpdate=true;
  // Pink ring: wider pulse swing (0.35..1.0 on the sine) so it visibly throbs.
  bgMat.size=(.35+Math.abs(Math.sin(time*.001*.7+1.5))*.65)*(.6+1.433*illum);
  bgMat.opacity=illum*psOp*(.5+Math.abs(Math.sin(time*.001*.7+1.5))*.5);
}

var BASE_COUNT=13;

// ── TICK ──
var prevTime=0,lastFrame=0,MIN_MS=1000/30;

function tick(now){
  requestAnimationFrame(tick);
  if(now-lastFrame<MIN_MS)return;
  lastFrame=now;
  var dt=Math.min((now-prevTime)/1000,.1);prevTime=now;if(dt<=0)return;

  // Autoplay: steady scroll when the user hasn't interacted
  if(autoplayActive){
    var maxY=document.documentElement.scrollHeight-window.innerHeight;
    var ny=window.scrollY+autoplaySpeed*dt*autoplayDir;
    if(ny>=maxY){ny=maxY;autoplayDir=-1;}
    else if(ny<=0){ny=0;autoplayDir=1;}
    window.scrollTo(0,ny);
  }

  // Per-room progress from cache
  roomData.forEach(function(r){
    var total=r.height-viewH;
    r.progress=total<=0?(r.top<=window.scrollY?1:0):clamp01((window.scrollY-r.top)/total);
  });
  var rp=roomData.map(function(r){return r.progress;});
  var mobilePortrait=mobilePortraitNow=viewW<=768&&viewH>viewW;

  // Active room for dots
  var best=-1;
  roomData.forEach(function(r,i){if(r.progress>0&&r.progress<1||i===0&&r.progress===0){var v=r.progress<.5?r.progress:1-r.progress;if(v<.15&&(best===-1||i>best))best=i;}});
  if(best===-1)for(var i=0;i<roomData.length;i++)if(roomData[i].progress>=1){best=i;}
  dots.forEach(function(d,i){d.classList.toggle('active',i===best);});

  // Room 1: DNA loader — fill (0-40%), hold fully lit centered, still spinning (40-70%), fade in place (70-100%)
  var helixP=rp[0],loader=document.getElementById('loader');
  var strandSpan=1/BASE_COUNT,LERP_SPEED=.08;
  var FILL_END=.4,HOLD_END=.7;
  var fillP=clamp01(helixP/FILL_END);                      // 0→1 over first ~4 scrolls
  var fadeP=clamp01((helixP-HOLD_END)/(1-HOLD_END));       // 0→1 over last ~3 scrolls
  if(!dnaSmooth){dnaSmooth=new Float32Array(BASE_COUNT);for(var i=0;i<BASE_COUNT;i++)dnaSmooth[i]=0;}
  dnaBases.forEach(function(base,i){
    var targetP=clamp01((fillP-i*strandSpan)/strandSpan);
    dnaSmooth[i]+=(targetP-dnaSmooth[i])*LERP_SPEED;
    var sp=dnaSmooth[i];
    var rotY=helixP*Math.PI*12+(i/BASE_COUNT)*Math.PI*2;   // motion continues the whole room, never freezes
    base.style.transform='rotateY('+(rotY*180/Math.PI)+'deg) rotateX(25deg)';
    base.style.backgroundSize=(smoothstep(sp)*100)+'% 100%';
    base.style.opacity=(.25+smoothstep(sp)*.75).toFixed(3);
    base.style.filter='none';
    if(sp>0){
      var glowP=smoothstep(sp),gt=clamp01((sp-.4)/.6);
      var gr=Math.round(34+(139-34)*(1-gt)),gg=Math.round(92+(197-92)*gt),gb=Math.round(246+(94-246)*gt);
      base.style.boxShadow='0 0 '+(glowP*6).toFixed(1)+'px rgba('+gr+','+gg+','+gb+','+(glowP*.7).toFixed(2)+')';
    }else base.style.boxShadow='none';
  });
  loader.style.opacity=(1-smoothstep(fadeP)).toFixed(3);

  // Room 2: Particles zoom (illumination is driven inside updateParticles by room progress)
  if(pts){var ps=lerp(.01,1,smoothstep(rp[1]));pts.scale.set(ps,ps,ps);bgPts.scale.set(ps,ps,ps);}

  // Room 3: Name reveal — typewriter 3 scrolls (0-33%), hold 3 scrolls (33-66%), fade out in place 3 scrolls (66-100%)
  if(rp[2]>.01){var tComp=1/3,tP=Math.min(1,rp[2]/tComp),target=Math.floor(tP*nameVPChars.length);if(target!==nameRevealCount){revealNameChars(target);nameRevealCount=target;}
    var nFade=clamp01((rp[2]-2/3)/(1/3));
    nameStage.style.opacity=(1-smoothstep(nFade)).toFixed(3);
    updateAllVP();}
  else{nameStage.style.opacity='0';nameRevealCount=0;}

  // Room 4: Title + Slogan
  if(rp[3]>.02){titleStage.style.opacity='1';var tp=Math.min(1,rp[3]/.35);roleText.style.opacity=tp;sloganText.style.opacity=Math.max(0,Math.min(1,(rp[3]-.2)/.3));updateAllVP();}
  else titleStage.style.opacity='0';

  // Room 5: Shrink to nav
  var shrinkP=rp[4],heroEl=document.getElementById('nameStage'),titleEl=document.getElementById('titleStage'),navBar=document.getElementById('topNav'),sloganBar=document.getElementById('sloganBar');
  if(shrinkP>.01){
    var shrink=lerp(1,.15,smoothstep(shrinkP)),topY=lerp(50,.3,shrinkP),leftX=lerp(50,1.5,shrinkP);
    heroEl.style.position='fixed';heroEl.style.top=topY+'vh';heroEl.style.left=leftX+'vw';heroEl.style.transform='translate(0,0) scale('+shrink+')';heroEl.style.transformOrigin='top left';heroEl.style.zIndex='46';heroEl.style.opacity=Math.min(1,shrinkP*4).toFixed(3);
    titleEl.style.position='fixed';titleEl.style.top=(topY+2.5)+'vh';titleEl.style.left=leftX+'vw';titleEl.style.transform='translate(0,0) scale('+(shrink*.7)+')';titleEl.style.transformOrigin='top left';titleEl.style.zIndex='46';titleEl.style.opacity=shrinkP>.25?'1':'0';
    sloganBar.classList.remove('visible');
    navBar.classList.toggle('visible',shrinkP>.75);
  }else{
    heroEl.style.position='';heroEl.style.top='';heroEl.style.left='';heroEl.style.transform='';heroEl.style.transformOrigin='';heroEl.style.zIndex='';
    titleEl.style.position='';titleEl.style.top='';titleEl.style.left='';titleEl.style.transform='';titleEl.style.transformOrigin='';titleEl.style.zIndex='';
    navBar.classList.remove('visible');sloganBar.classList.remove('visible');
  }

  // Room 6: Gallery
  var galP=rp[5],gallery=document.getElementById('galleryRoom'),floor=document.getElementById('galleryFloor'),sectBtns=document.getElementById('sectionButtons'),varprox=document.getElementById('varprox');
  if(galP>0){gallery.style.opacity='1';gallery.style.visibility='visible';floor.classList.add('visible');varprox.classList.add('visible');
    var ringCards=document.querySelectorAll('.ring-card'),total=ringCards.length,sp=galP*(total-1),activeIdx=Math.max(0,Math.min(total-1,Math.round(sp)));
    var STIFF=.08,DAMP=.72;
    if(!mobilePortrait){ringCards.forEach(function(card,i){var dist=i-activeIdx,s=card._spring,tx,tz,ry,sc,op;
      if(dist===0){tx=0;tz=120;ry=0;sc=1;op=1;}else if(dist===-1){tx=-370;tz=-130;ry=32;sc=1;op=1;}else if(dist===1){tx=370;tz=-130;ry=-32;sc=1;op=1;}else if(dist===-2){tx=-550;tz=-230;ry=42;sc=1;op=.5;}else if(dist===2){tx=550;tz=-230;ry=-42;sc=1;op=.5;}else{tx=0;tz=-400;ry=0;sc=1;op=0;}
      s.vtx+=(tx-s.tx)*STIFF;s.vtx*=DAMP;s.tx+=s.vtx;s.vtz+=(tz-s.tz)*STIFF;s.vtz*=DAMP;s.tz+=s.vtz;s.vry+=(ry-s.ry)*STIFF;s.vry*=DAMP;s.ry+=s.vry;s.vsc+=(sc-s.sc)*STIFF;s.vsc*=DAMP;s.sc+=s.vsc;s.vop+=(op-s.op)*STIFF;s.vop*=DAMP;s.op+=s.vop;
      card.style.transform='translateX('+s.tx.toFixed(1)+'px) translateZ('+s.tz.toFixed(1)+'px) rotateY('+s.ry.toFixed(1)+'deg) scale('+s.sc.toFixed(2)+')';
      card.style.opacity=Math.max(0,Math.min(1,s.op)).toFixed(3);card.style.zIndex=dist===0?'100':Math.abs(dist)===1?'50':'30';card.style.pointerEvents=s.op>.3?'auto':'none';
      card.style.boxShadow='none';
    });}
    navBar.classList.add('visible');sectBtns.classList.toggle('visible',galP>(mobilePortrait?0.6:0));
    if(mobilePortrait){
      // Touch has no hover: label the active card persistently (the scroll handler
      // below keeps it in step while the carousel is swiped).
      $cardName.textContent=cardData[activeIdx].name;
      $cardInfo.style.opacity='1';
      galPrev.classList.toggle('visible',activeIdx>0);
      galNext.classList.toggle('visible',activeIdx<total-1);
    }
  }else{gallery.style.opacity='0';gallery.style.visibility='hidden';floor.classList.remove('visible');sectBtns.classList.remove('visible');varprox.classList.remove('visible');}

  updateParticles(now);
  if(renderer){renderer.render(scene3,cam);if(viewW!==renderer.domElement.width||viewH!==renderer.domElement.height){renderer.setSize(viewW,viewH);cam.aspect=viewW/viewH;cam.updateProjectionMatrix();}}
}

prevTime=performance.now();
// ── GALLERY ARROWS (touch) ──
// Swipe already works via scroll-snap; the arrows exist so the affordance is
// discoverable. Caption stays in step with whichever card is actually centred.
function galleryStep(dir){
  var card=galleryRoom.querySelector('.ring-card');
  var w=card?card.offsetWidth+18:galleryRoom.clientWidth*0.8;
  galleryRoom.scrollBy({left:dir*w,behavior:'smooth'});
}
function updateGalleryCaption(){
  if(!mobilePortraitNow)return;
  var cards=galleryRoom.querySelectorAll('.ring-card');
  if(!cards.length)return;
  var mid=galleryRoom.scrollLeft+galleryRoom.clientWidth/2,best=0,bestD=Infinity;
  for(var i=0;i<cards.length;i++){
    var cc=cards[i].offsetLeft+cards[i].offsetWidth/2,d=Math.abs(cc-mid);
    if(d<bestD){bestD=d;best=i;}
  }
  $cardName.textContent=cardData[best].name;
  $cardInfo.style.opacity='1';
  galPrev.classList.toggle('visible',best>0);
  galNext.classList.toggle('visible',best<cards.length-1);
}
if(galPrev){galPrev.addEventListener('click',function(){galleryStep(-1);});}
if(galNext){galNext.addEventListener('click',function(){galleryStep(1);});}
galleryRoom.addEventListener('scroll',updateGalleryCaption,{passive:true});
// ── AUTOPLAY: if the user doesn't interact, scroll the whole experience at a steady pace,
// reversing direction at each end so it keeps cycling and can draw the eye back.
// Any user input pauses it; if they go idle again for 4s, it resumes from where it left off ──
var autoplayActive=false,autoplaySpeed=0,autoplayDir=1,autoplayTimer=null;
function armAutoplay(){
  autoplayTimer=setTimeout(function(){
    autoplaySpeed=Math.max(50,document.documentElement.scrollHeight/80); // full journey ≈ 80s
    autoplayActive=true;
  },4000);
}
function pauseAutoplay(){
  autoplayActive=false;
  clearTimeout(autoplayTimer);
  armAutoplay();
}
armAutoplay();
['wheel','touchstart','touchmove','keydown','pointerdown'].forEach(function(ev){
  window.addEventListener(ev,pauseAutoplay,{passive:true});
});
// Scroll reset: force the experience to start at the top on every refresh
// (browsers otherwise restore the previous scroll position on reload).
if('scrollRestoration' in history)history.scrollRestoration='manual';
window.scrollTo(0,0);
requestAnimationFrame(tick);
})();
</script>
